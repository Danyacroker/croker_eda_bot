<style>
:root{
  --fb-bg:#efeff3; --fb-card:#ffffff; --fb-text:#16161a; --fb-hint:#8a8a90;
  --fb-accent:#2b8a64; --fb-accent-text:#ffffff; --fb-link:#2b8a64;
  --fb-sep:rgba(0,0,0,.08); --fb-danger:#d63b3b;
}
@media (prefers-color-scheme: dark){
  :root{
    --fb-bg:#101012; --fb-card:#1d1d20; --fb-text:#f1f1f3; --fb-hint:#8e8e95;
    --fb-accent:#4cc394; --fb-accent-text:#062a1d; --fb-link:#4cc394;
    --fb-sep:rgba(255,255,255,.09); --fb-danger:#ff6d6d;
  }
}
:root{
  --bg:var(--tg-theme-secondary-bg-color,var(--fb-bg));
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,var(--fb-card)));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --accent:var(--tg-theme-button-color,var(--fb-accent));
  --accent-text:var(--tg-theme-button-text-color,var(--fb-accent-text));
  --link:var(--tg-theme-link-color,var(--fb-link));
  --sep:var(--tg-theme-section-separator-color,var(--fb-sep));
  --danger:var(--tg-theme-destructive-text-color,var(--fb-danger));
  --soft:rgba(128,128,136,.14);
  --ok:#2f9e5b; --warn:#e2702a; --hot:#ff7a1a;
  --tabs-h:58px;
  --safe-b:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --vh:var(--tg-viewport-stable-height,100vh);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.hint{color:var(--hint)}
.small{font-size:13px}
.grow{flex:1;min-width:0}

/* ---------- каркас ---------- */
#screen{max-width:640px;margin:0 auto;padding:10px 14px calc(var(--tabs-h) + var(--safe-b) + 28px)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;height:calc(var(--tabs-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--sep)}
.tab{flex:1;border:0;background:none;color:var(--hint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;margin:-4px 0 0 22px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:11px;line-height:17px;padding:0 4px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.top h1{font-size:28px;font-weight:750;letter-spacing:-.02em}
.top-acts{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center;flex:none;font-size:20px}
.icon-btn svg{width:22px;height:22px}
.icon-btn.accent{background:var(--accent);color:var(--accent-text)}

.sec{font-size:13px;font-weight:600;color:var(--hint);margin:22px 4px 8px}
.card{background:var(--card);border-radius:16px}
.list .li + .li{border-top:1px solid var(--sep)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:52px}
.li.tap{cursor:pointer}
.li .t{font-weight:600;line-height:1.25}
.li .sub{font-size:13px;line-height:1.3;margin-top:3px;color:var(--hint)}
.sub.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.sub.miss::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.list-h{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;font-size:13px;font-weight:600;color:var(--hint)}
.list-h .dot{width:9px;height:9px;border-radius:50%}
.list-h + .li{border-top:0}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.soft{background:var(--soft);color:var(--text)}
.btn.ghost{background:none;color:var(--link)}
.btn.danger{background:none;color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.link{border:0;background:none;color:var(--link);padding:8px 2px;font-weight:500}
.link.small{font-size:13px;padding:4px 2px}
.btn-row{display:flex;gap:8px}
.btn-row>*{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--sep);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:transparent;color:var(--accent-text)}
.chip.home{background:none;border-style:dashed;color:var(--hint)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}

.inp{width:100%;border:0;border-radius:12px;padding:11px 13px;background:var(--card);color:var(--text);font:inherit;outline:none;-webkit-appearance:none}
textarea.inp{resize:vertical;line-height:1.45}
.inp::placeholder{color:var(--hint)}
.search{margin-bottom:10px}
.fld{display:block;margin:16px 0}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--hint);margin:0 4px 7px}

.thumb{width:52px;height:52px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:27px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.xs{width:30px;height:30px;border-radius:8px;font-size:17px}
.thumb.lg{width:100%;height:auto;aspect-ratio:4/3;border-radius:16px;font-size:72px}

/* ---------- холодильник ---------- */
.fridge{position:relative;padding:16px 16px 16px;border-radius:22px;background:var(--card)}
.fridge::after{content:"";position:absolute;right:9px;top:22px;width:4px;height:46px;border-radius:3px;background:var(--soft)}
.fridge-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 14px 12px 0}
.fridge-head b{font-size:17px}
.mags{display:flex;flex-wrap:wrap;gap:7px;padding-right:14px}
.mag{border:0;border-left:4px solid var(--c);background:var(--bg);border-radius:9px;padding:7px 11px 7px 9px;font-size:14px;line-height:1.2}
.mag.hot{box-shadow:inset 0 0 0 1.5px var(--hot)}
.fridge-empty p{color:var(--hint);margin:0 14px 14px 0;line-height:1.45}
.legend{font-size:12px;color:var(--hint);margin:12px 0 0}

/* ---------- блюда ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.dcard{border:0;padding:0;background:var(--card);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.dcard .ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:46px;overflow:hidden}
.dcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dcard .nm{padding:9px 11px 2px;font-weight:600;font-size:14px;line-height:1.25}
.dcard .tg{padding:2px 11px 11px;font-size:12px;color:var(--hint)}
.empty{text-align:center;color:var(--hint);padding:34px 20px;line-height:1.5}
.empty .btn{margin-top:14px}

/* ---------- меню ---------- */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.week-nav b{font-size:15px}
.week-nav .icon-btn{background:none;width:38px;height:38px}
.day{margin-bottom:10px;overflow:hidden}
.day.past{opacity:.55}
.day-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.day-h b{font-size:16px}
.today-tag{font-size:12px;font-weight:600;color:var(--accent);margin-left:6px}
.slot{display:flex;gap:10px;padding:7px 14px;align-items:flex-start;border-top:1px solid var(--sep)}
.slot-meal{width:68px;flex:none;font-size:13px;color:var(--hint);padding-top:7px}
.slot-items{flex:1;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.entry{border:0;background:var(--bg);border-radius:10px;padding:4px 10px 4px 4px;display:inline-flex;align-items:center;gap:8px;font-size:14px;max-width:100%;text-align:left}
.entry span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry small{color:var(--hint)}
.entry.done span{text-decoration:line-through;color:var(--hint)}
.add{border:1px dashed var(--sep);background:none;border-radius:10px;width:38px;height:38px;color:var(--hint);font-size:20px;display:grid;place-items:center}

/* ---------- покупки ---------- */
.shop-row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;min-height:50px}
.list .shop-row + .shop-row{border-top:1px solid var(--sep)}
.ck{width:23px;height:23px;border-radius:50%;border:2px solid var(--hint);flex:none;display:grid;place-items:center;opacity:.8}
.done .ck{background:var(--accent);border-color:var(--accent);opacity:1}
.done .ck::after{content:"";width:6px;height:11px;border:solid var(--accent-text);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.sr-name{flex:1;min-width:0}
.sr-name small{display:block;color:var(--hint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .sr-name>span{text-decoration:line-through;color:var(--hint)}
.sr-q{font-variant-numeric:tabular-nums;color:var(--hint);white-space:nowrap}
.summary{margin:4px 4px 10px;color:var(--hint);font-size:14px}
.add-row{display:flex;gap:8px;padding:10px 14px}
.add-row .inp{background:var(--bg)}
details.home-box{margin-top:12px}
details.home-box summary{list-style:none;cursor:pointer;padding:12px 14px;color:var(--hint);font-size:14px;font-weight:500}
details.home-box summary::-webkit-details-marker{display:none}
details.home-box summary::after{content:" ▾"}
details[open].home-box summary::after{content:" ▴"}
.x{border:0;background:none;color:var(--hint);font-size:20px;width:32px;height:32px;flex:none;border-radius:8px}

/* ---------- экраны поверх ---------- */
#view-layer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#view-layer.open{display:block}
#view-layer.push{animation:push .24s ease-out}
@keyframes push{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.view{max-width:640px;margin:0 auto;padding-bottom:calc(var(--safe-b) + 90px)}
.vhead{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
.vhead h2{font-size:22px;font-weight:700}
.pad{padding:0 14px}
.hero{position:relative;width:100%;aspect-ratio:4/3;max-height:calc(var(--vh) * .45);display:grid;place-items:center;font-size:88px;overflow:hidden;cursor:pointer;border:0;padding:0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:var(--hint)}
.hero-back{position:absolute;top:12px;left:12px;z-index:2;background:var(--card)}
.d-title{font-size:25px;font-weight:750;letter-spacing:-.015em;margin:16px 0 6px;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:13px;background:var(--card);border-radius:8px;padding:4px 9px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.actions .btn{padding:11px 6px;font-size:14px}
.ing{display:flex;gap:10px;padding:10px 14px;align-items:flex-start}
.list .ing + .ing{border-top:1px solid var(--sep)}
.ing .st{width:20px;height:20px;border-radius:50%;flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:700}
.ing .st.y{background:var(--ok);color:#fff}
.ing .st.n{border:2px solid var(--sep)}
.ing .alt{color:var(--hint);font-size:13px}
.ing .q{margin-left:auto;color:var(--hint);white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:8px}
.notes{white-space:pre-wrap;padding:14px;line-height:1.5}

/* редактор */
.photo-pick{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:56px;position:relative;margin-top:8px;padding:0}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick .hero-hint{bottom:10px}
.two{display:grid;grid-template-columns:1fr 84px;gap:10px}
.two .fld{margin:16px 0 0}
.ing-group{padding:6px 0}
.list .ing-group + .ing-group,.list .ing-row + .ing-row{border-top:1px solid var(--sep)}
.ing-row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px}
.ing-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.qty{width:70px;border:0;border-radius:9px;background:var(--bg);color:var(--text);padding:8px;font:inherit;text-align:right;outline:none}
.unit{width:44px;color:var(--hint);font-size:13px}
.or{font-size:12px;color:var(--hint);padding:0 0 0 30px}
.ing-group .link{margin-left:28px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;padding:3px}
.stepper button{width:36px;height:36px;border:0;background:none;font-size:20px;border-radius:9px}
.stepper b{min-width:28px;text-align:center}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}

/* ---------- шторки ---------- */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:640px;max-height:calc(var(--vh) * .9);overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 14px calc(18px + var(--safe-b));animation:up .22s ease-out}
.grab{width:38px;height:5px;border-radius:3px;background:var(--soft);margin:4px auto 10px}
.sheet h3{font-size:19px;font-weight:700;margin:2px 2px 12px}
.sheet-head{position:sticky;top:-6px;z-index:2;background:var(--bg);padding:2px 0 8px}
.sheet .li,.sheet .card .li{background:var(--card)}
.sheet .card{overflow:hidden}
.sheet .chips{margin-bottom:4px}
.sheet .btn.block + .btn.block{margin-top:8px}
.ent-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.ent-head h3{margin:0 0 2px}
.pop p{margin:4px 2px 16px;line-height:1.45}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + var(--safe-b) + 16px);z-index:90;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(28,28,30,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:86vw;text-align:center;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fallback-main{position:fixed;left:14px;right:14px;bottom:calc(12px + var(--safe-b));z-index:40;max-width:612px;margin:0 auto;padding:15px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#fallback-main[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ================= Хранилище ================= */
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('chto-gotovim', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); };
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  req(store, mode, fn) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && 'result' in r ? r.result : true); tx.onerror = () => res(null); }
      catch (e) { res(null); }
    });
  },
  get(s, k) { return this.req(s, 'readonly', st => st.get(k)); },
  set(s, k, v) { return this.req(s, 'readwrite', st => { st.put(v, k); }); },
  del(s, k) { return this.req(s, 'readwrite', st => { st.delete(k); }); },
  clear(s) { return this.req(s, 'readwrite', st => { st.clear(); }); },
  async entries(s) {
    const keys = (await this.req(s, 'readonly', st => st.getAllKeys())) || [];
    const out = [];
    for (const k of keys) out.push([k, await this.get(s, k)]);
    return out;
  }
};

let S;

  if (!str) return [];
  return str.split(';').map(g => g.trim()).filter(Boolean).map(g => g.split('|').map(o => { const [p, q] = o.trim().split(/\s+/); return [p, parseFloat(q) || 0]; }));
}
function buildSeed() {
  const products = {};
  SEED.products.forEach(([id, n, c, u]) => { products[id] = { n, c, u }; });
  const dishes = {};
  SEED.dishes.forEach((d, i) => {

  return { v: 1, products, dishes, pantry: {}, plan: {}, photos: {}, shop: { checked: {}, force: {}, extra: [] }, settings: { meals: ['b', 'l', 'd'] } };
}
function migrate(st) {
  st.products = st.products || {}; st.dishes = st.dishes || {}; st.pantry = st.pantry || {}; st.plan = st.plan || {}; st.photos = st.photos || {};
  st.shop = Object.assign({ checked: {}, force: {}, extra: [] }, st.shop || {});

const photoURL = {};
async function loadPhotos() {
  Object.keys(photoURL).forEach(k => { URL.revokeObjectURL(photoURL[k]); delete photoURL[k]; });
  for (const [k, b] of await DB.entries('photos')) if (b) photoURL[k] = URL.createObjectURL(b);

function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { res(i); URL.revokeObjectURL(u); }; i.onerror = rej; i.src = u; });
}
async function compress(file, max = 1000) {
  const img = await loadImg(file);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', 0.8));
}

/* ================= Синхронизация с сервером ================= */
const SYNC = { snap: {}, lastTs: 0, photoVers: {}, ready: false, pushing: false, again: false, pulling: false, online: true, blocked: false, hold: false };

async function api(path, opt = {}) {
  const headers = Object.assign({ 'X-Init-Data': tg.initData }, opt.headers || {});
  let body = opt.body;
  if (opt.json !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opt.json); }
  const r = await fetch(API + path, { method: opt.method || 'GET', headers, body });
  const ct = r.headers.get('content-type') || '';
  if (!r.ok) {
    let data = null;
    if (ct.includes('json')) try { data = await r.json(); } catch (e) {}
    const err = new Error((data && data.error) || 'HTTP ' + r.status); err.status = r.status; err.data = data;
    throw err;
  }
  return ct.includes('json') ? r.json() : r;
}
function emptyState() { return { v: 1, products: {}, dishes: {}, pantry: {}, plan: {}, photos: {}, shop: { checked: {}, force: {}, extra: [] }, settings: null }; }

// Состояние раскладывается на маленькие записи: каждое блюдо, продукт, день меню, отметка в списке — отдельно.
// Так двое могут менять разное одновременно, не мешая друг другу.
function records(st) {
  const out = {};
  const put = (k, obj) => { for (const id in obj) out[k + ':' + id] = obj[id]; };
  put('p', st.products); put('d', st.dishes); put('h', st.pantry); put('g', st.photos || {});
  for (const k in st.plan) { const day = st.plan[k]; if (day && Object.values(day).some(a => a && a.length)) out['m:' + k] = day; }
  for (const p in st.shop.checked) if (st.shop.checked[p]) out['c:' + p] = 1;
  for (const p in st.shop.force) if (st.shop.force[p]) out['f:' + p] = 1;
  st.shop.extra.forEach(x => { out['x:' + x.id] = x; });
  if (st.settings) out['s:main'] = st.settings;
  return out;
}
function setRecord(kind, id, v) {
  const del = v === undefined;
  const on = (obj, val) => { if (del) delete obj[id]; else obj[id] = val; };
  switch (kind) {
    case 'p': on(S.products, v); break;
    case 'd': on(S.dishes, v); break;
    case 'h': on(S.pantry, v); break;
    case 'g': on(S.photos, v); break;
    case 'm': on(S.plan, v); break;
    case 'c': on(S.shop.checked, true); break;
    case 'f': on(S.shop.force, true); break;
    case 'x': {
      const i = S.shop.extra.findIndex(x => x.id === id);
      if (del) { if (i >= 0) S.shop.extra.splice(i, 1); } else if (i >= 0) S.shop.extra[i] = v; else S.shop.extra.push(v);
      break;
    }
    case 's': if (!del) S.settings = v; break;
  }
}
function setSnap(k, j) { if (j === null) delete SYNC.snap[k]; else SYNC.snap[k] = j; }
function diffChanges() {
  const rec = records(S), ch = [];
  for (const k in rec) { const j = JSON.stringify(rec[k]); if (SYNC.snap[k] !== j) ch.push([k, j]); }
  for (const k in SYNC.snap) if (!(k in rec)) ch.push([k, null]);
  return ch;
}
async function push() {
  if (!SERVER || !SYNC.ready || SYNC.blocked || SYNC.hold) return;
  if (SYNC.pushing) { SYNC.again = true; return; }
  const ch = diffChanges();
  if (!ch.length) return;
  SYNC.pushing = true;
  try {
    for (let i = 0; i < ch.length; i += 300) {
      const part = ch.slice(i, i + 300);
      await api('/api/sync', { method: 'POST', json: { changes: part.map(([k, j]) => { const c = k.indexOf(':'); return { k: k.slice(0, c), id: k.slice(c + 1), d: j }; }) } });
      part.forEach(([k, j]) => setSnap(k, j));
    }
    netState(true);
    persistLocal();
  } catch (e) { netState(false, e); }
  finally { SYNC.pushing = false; if (SYNC.again) { SYNC.again = false; push(); } }
}
function applyRows(rows) {
  if (!rows.length) return false;
  const rec = records(S);
  let changed = false;
  for (const r of rows) {
    const key = r.kind + ':' + r.id;
    const serverJ = r.deleted ? null : r.data;
    const localJ = key in rec ? JSON.stringify(rec[key]) : null;
    const snapJ = key in SYNC.snap ? SYNC.snap[key] : null;
    if (localJ !== snapJ) { if (localJ === serverJ) setSnap(key, serverJ); continue; } // своя правка ещё не отправлена
    if (serverJ === localJ) { setSnap(key, serverJ); continue; }
    let v;
    if (serverJ !== null) { try { v = JSON.parse(serverJ); } catch (e) { continue; } }
    setRecord(r.kind, r.id, v);
    setSnap(key, serverJ);
    changed = true;
  }
  return changed;
}
async function fetchRows(since) {
  const all = [];
  for (let guard = 0; guard < 50; guard++) {
    const r = await api('/api/sync?since=' + since);
    all.push(...r.rows);
    if (r.rows.length < 5000) break;
    since = r.rows[r.rows.length - 1].updated_at - 1;
  }
  return all;
}
function trackTs(rows) { for (const x of rows) if (x.updated_at > SYNC.lastTs) SYNC.lastTs = x.updated_at; }
async function pull() {
  if (!SERVER || !SYNC.ready || SYNC.blocked || SYNC.pulling) return;
  SYNC.pulling = true;
  try {
    const rows = await fetchRows(Math.max(0, SYNC.lastTs - 5000));
    const changed = applyRows(rows);
    trackTs(rows);
    netState(true);
    const ph = await syncPhotos();
    if (rows.length || ph) persistLocal();
    if (changed || ph) softRender();
  } catch (e) { netState(false, e); }
  finally { SYNC.pulling = false; }
}
async function syncPhotos() {
  let changed = false;
  for (const id of Object.keys(SYNC.photoVers)) {
    if (S.photos[id]) continue;
    delete SYNC.photoVers[id]; await DB.del('photos', id);
    if (photoURL[id]) { URL.revokeObjectURL(photoURL[id]); delete photoURL[id]; }
    changed = true;
  }
  for (const [id, meta] of Object.entries(S.photos)) {
    if (!meta || SYNC.photoVers[id] === meta.v) continue;
    try {
      const r = await api('/api/photo/' + encodeURIComponent(id));
      const b = await r.blob();
      await DB.set('photos', id, b);
      if (photoURL[id]) URL.revokeObjectURL(photoURL[id]);
      photoURL[id] = URL.createObjectURL(b);
      SYNC.photoVers[id] = meta.v; changed = true;
    } catch (e) { if (e.status === 404) SYNC.photoVers[id] = meta.v; else break; }
  }
  return changed;
}
function netState(ok, err) {
  if (err && (err.status === 401 || err.status === 403)) { showAccessError(err); return; }
  if (ok !== SYNC.online) { SYNC.online = ok; toast(ok ? 'Связь с сервером восстановлена' : 'Нет связи с сервером. Изменения отправятся позже'); }
}
let pendingRender = false;
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) { pendingRender = true; return; }
  render(); refreshSheet();
}
document.addEventListener('focusout', () => { if (pendingRender) { pendingRender = false; setTimeout(() => { render(); refreshSheet(); }, 60); } });

function lockScreen(icon, title, html) {
  SYNC.blocked = true;
  UI.views = []; closeSheet(true); renderViews(); updateChrome();

}
function showAccessError(err) {
  if (err.status === 403) {
    const id = esc(err.data && err.data.id);
    lockScreen('🔒', 'Нужен доступ', `<p>Добавьте этот номер в переменную ALLOWED_IDS на сервере Cloudflare, затем закройте и снова откройте приложение.</p><p style="font-size:28px;font-weight:700;color:var(--text);margin:20px 0 8px;user-select:all">${id}</p><button class="btn" data-a="copy-id" data-id="${id}">Скопировать номер</button>`);
  } else {
    lockScreen('🔑', 'Не удалось войти', `<p>Закройте приложение и откройте его снова кнопкой в чате с ботом. Если не помогает, проверьте секрет BOT_TOKEN в настройках сервера: это должен быть токен именно этого бота.</p>`);
  }
}
function showLoadError(e) {
  const hint = e && e.status === 500 && e.data ? `<p class="small">Сервер ответил: ${esc(e.data.error)}${e.data.message ? ' — ' + esc(e.data.message) : ''}</p>` : '<p class="small">Проверьте интернет и адрес сервера в начале файла index.html.</p>';
  lockScreen('📡', 'Сервер не отвечает', `<p>Не получилось загрузить общую базу.</p>${hint}<button class="btn" style="margin-top:14px" data-a="reload">Попробовать снова</button>`);
}

async function initServer(localState) {
  const meta = await DB.get('kv', 'sync');
  if (meta && meta.api === API && localState && localState.dishes) {
    // быстрый старт из кэша, потом догружаем свежее
    S = migrate(localState);
    Object.assign(SYNC, { snap: meta.snap || {}, lastTs: meta.lastTs || 0, photoVers: meta.photoVers || {}, ready: true });
    await loadPhotos();
    render(); push(); pull();
    return;
  }
  $('#screen').innerHTML = '<div class="empty" style="padding-top:30vh">Загружаем общую базу…</div>';
  let rows;
  try { rows = await fetchRows(0); }
  catch (e) { if (e.status === 401 || e.status === 403) showAccessError(e); else showLoadError(e); return; }
  if (!rows.length) {
    // Сервер пустой: переносим базу с этого телефона (или исходную)
    S = localState && localState.dishes ? migrate(localState) : buildSeed();
    S.photos = {};
    SYNC.snap = {}; SYNC.photoVers = {}; SYNC.ready = true;
    await push();
    for (const [id, b] of await DB.entries('photos')) { if (b && S.dishes[id]) { try { await savePhoto(id, b); } catch (e) {} } }
    toast('База перенесена на сервер');
  } else {
    S = emptyState();
    SYNC.snap = {}; SYNC.photoVers = {};
    await DB.clear('photos');
    applyRows(rows);
    trackTs(rows);
    if (!S.settings) S.settings = { meals: ['b', 'l', 'd'] };
    SYNC.ready = true;
  }
  trackTs(rows);
  persistLocal();
  await loadPhotos();
  render();
  if (await syncPhotos()) { persistLocal(); softRender(); }
  push();
}

/* ================= Предметная логика ================= */
const pname = id => S.products[id]?.n ?? '(удалён)';
const punit = id => S.products[id]?.u ?? '';
const catColor = id => CATS[S.products[id]?.c]?.c || CATS.other.c;
const atHome = id => !!S.pantry[id];
const isHot = id => !!S.pantry[id]?.hot;
const groupLabel = g => g.map(([p]) => pname(p)).join(' или ');
const allPids = d => [...d.r.flat().map(o => o[0]), ...d.o.map(o => o[0])];
function sortProducts(ids) { return ids.slice().sort((a, b) => (CAT_KEYS.indexOf(S.products[a].c) - CAT_KEYS.indexOf(S.products[b].c)) || pname(a).localeCompare(pname(b), 'ru')); }
function defQty(pid) { return ({ 'г': 100, 'мл': 100, 'шт': 1, 'пучок': 0.5, 'упак': 1 })[punit(pid)] ?? 1; }

function analyze(d) {
  const have = [], missing = [];
  d.r.forEach((g, gi) => { const h = g.find(([p]) => atHome(p)); if (h) have.push(h[0]); else missing.push(gi); });
  const optHave = d.o.filter(([p]) => atHome(p)).map(([p]) => p);
  const used = [...have, ...optHave];
  return { have, missing, optHave, used, hot: used.filter(isHot).length };
}
const homeScore = a => a.have.length * 2 + a.optHave.length * 0.7 + a.hot * 4 - a.missing.length * 1.2;

function suggestions(meal) {
  const list = Object.entries(S.dishes).filter(([, d]) => !meal || d.m.includes(meal)).map(([id, d]) => ({ id, d, a: analyze(d) }));
  const by = (x, y) => (y.a.hot - x.a.hot) || (homeScore(y.a) - homeScore(x.a)) || x.d.n.localeCompare(y.d.n, 'ru');
  return {
    ready: list.filter(x => !x.a.missing.length).sort(by),
    almost: list.filter(x => x.a.missing.length && x.a.missing.length <= 2 && x.a.have.length).sort(by)
  };
}

/* ---------- меню ---------- */
function slot(k, m) { S.plan[k] = S.plan[k] || {}; S.plan[k][m] = S.plan[k][m] || []; return S.plan[k][m]; }
const getSlot = (k, m) => (S.plan[k] && S.plan[k][m]) || [];
function newEntry(dishId) {
  const d = S.dishes[dishId], ch = {};
  d.r.forEach((g, gi) => { if (g.length > 1) { const i = g.findIndex(([p]) => atHome(p)); ch[gi] = i < 0 ? 0 : i; } });
  return { id: uid('e'), d: dishId, p: 2, ch, opt: [] };
}
function findEntry(k, m, eid) { return getSlot(k, m).find(e => e.id === eid); }
function entryNeeds(e) {
  const d = S.dishes[e.d]; if (!d) return [];
  const f = e.p / (d.s || 2), out = [];
  d.r.forEach((g, gi) => { const o = g[Math.min(e.ch?.[gi] ?? 0, g.length - 1)]; if (o) out.push([o[0], o[1] * f]); });
  d.o.forEach(([p, q]) => { if (e.opt?.includes(p)) out.push([p, q * f]); });
  return out;
}
function entriesOf(days) {
  const out = [];
  days.forEach(k => MEAL_KEYS.forEach(m => getSlot(k, m).forEach(e => { if (S.dishes[e.d]) out.push({ k, m, e }); })));
  return out;
}
function buildList(days) {
  const agg = {}, src = {};
  entriesOf(days).forEach(({ e }) => entryNeeds(e).forEach(([p, q]) => {
    if (!S.products[p]) return;
    agg[p] = (agg[p] || 0) + q;
    (src[p] = src[p] || new Set()).add(S.dishes[e.d].n);
  }));
  const buy = [], home = [];
  Object.keys(agg).forEach(p => { const it = { p, q: agg[p], src: [...src[p]] }; (atHome(p) && !S.shop.force[p] ? home : buy).push(it); });
  const ord = (a, b) => (CAT_KEYS.indexOf(S.products[a.p].c) - CAT_KEYS.indexOf(S.products[b.p].c)) || pname(a.p).localeCompare(pname(b.p), 'ru');
  return { buy: buy.sort(ord), home: home.sort(ord) };
}

function autofill(dayKeys) {
  const weekKeys = weekDays(UI.week).map(dkey);
  const count = {};             // сколько раз блюдо уже стоит в неделе
  const fromHome = new Set();   // продукты из холодильника, которые уже «заняты» другими блюдами
  const buySet = new Set();     // продукты, которые и так покупаем
  const take = e => entryNeeds(e).forEach(([p]) => { if (atHome(p) && !fromHome.has(p)) fromHome.add(p); else buySet.add(p); });
  entriesOf(weekKeys).forEach(({ e }) => { count[e.d] = (count[e.d] || 0) + 1; take(e); });
  const free = p => atHome(p) && !fromHome.has(p);
  let added = 0;
  dayKeys.forEach(k => S.settings.meals.forEach(m => {
    if (getSlot(k, m).length) return;
    const cands = Object.entries(S.dishes).filter(([, d]) => d.m.includes(m));
    if (!cands.length) return;
    let best = null, bestS = -1e9;
    cands.forEach(([id, d]) => {
      let s = 0;
      d.r.forEach(g => {
        const h = g.find(([p]) => free(p));
        if (h) s += isHot(h[0]) ? 6 : 2;
        else if (g.some(([p]) => buySet.has(p))) s += 1;   // докупаем то, что уже в списке
        else s -= 1.2;
      });
      d.o.forEach(([p]) => { if (free(p)) s += isHot(p) ? 2 : 0.5; });
      s -= 8 * (count[id] || 0);
      if (d.last && daysSince(d.last) < 3) s -= 2;
      s += Math.random() * 3;
      if (s > bestS) { bestS = s; best = id; }
    });
    const e = newEntry(best);
    slot(k, m).push(e); count[best] = (count[best] || 0) + 1; added++;
    take(e);
  }));
  save();
  return added;
}

function ensureShopSel() {
  const days = weekDays(UI.week).map(dkey);
  if (!UI.shopSel) { const t = todayKey(); const fut = days.filter(k => k >= t); UI.shopSel = new Set(fut.length ? fut : days); }
  return days;
}
function shopRow(it, mode) {
  const p = it.p, done = mode === 'buy' && S.shop.checked[p];
  if (mode === 'home') return `<div class="shop-row"><div class="sr-name"><span>${esc(pname(p))}</span><small>${esc(it.src.join(', '))}</small></div><span class="sr-q">${fmtQ(it.q, punit(p), true)}</span><button class="btn sm soft" data-a="shop-force" data-p="${p}">Купить</button></div>`;
  return `<div class="shop-row ${done ? 'done' : ''}" data-a="shop-check" data-p="${p}" role="checkbox" aria-checked="${!!done}" tabindex="0"><span class="ck"></span><div class="sr-name"><span>${esc(pname(p))}</span><small>${esc(it.src.join(', '))}</small></div><span class="sr-q">${fmtQ(it.q, punit(p), true)}</span>${S.shop.force[p] ? `<button class="x" data-a="shop-unforce" data-p="${p}" aria-label="Не покупать">×</button>` : ''}</div>`;
}
function renderShop() {
  const days = ensureShopSel();
  const sel = days.filter(k => UI.shopSel.has(k));
  const { buy, home } = buildList(sel);
  const nDish = entriesOf(sel).length;
  let h = `<header class="top"><h1>Покупки</h1><button class="icon-btn" data-a="shop-share" aria-label="Поделиться списком">${ICON.share}</button></header>${weekNav()}`;
  h += `<div class="chips scroll">${days.map(k => { const x = parseKey(k); return `<button class="chip ${UI.shopSel.has(k) ? 'on' : ''}" data-a="shop-day" data-k="${k}">${DOW[(x.getDay() + 6) % 7]} ${x.getDate()}</button>`; }).join('')}<button class="chip" data-a="shop-all">Вся неделя</button></div>`;
  if (!nDish) {
    h += `<div class="empty">На выбранные дни меню пустое.<br>Соберите меню, и список посчитается сам.<br><button class="btn" data-a="tab" data-tab="menu">Открыть меню</button></div>`;
  } else {
    const left = buy.filter(it => !S.shop.checked[it.p]).length;
    h += `<p class="summary" style="margin-top:12px">${nDish} ${plural(nDish, ['блюдо', 'блюда', 'блюд'])}, купить ${buy.length} ${plural(buy.length, ['продукт', 'продукта', 'продуктов'])}${buy.length && left < buy.length ? `, осталось ${left}` : ''}</p>`;
    let cur = null, open = false;
    buy.forEach(it => {
      const c = S.products[it.p].c;
      if (c !== cur) { if (open) h += `</div>`; h += `<div class="card list" style="margin-bottom:10px"><div class="list-h"><span class="dot" style="background:${CATS[c].c}"></span>${CATS[c].n}</div>`; cur = c; open = true; }
      h += shopRow(it, 'buy');
    });
    if (open) h += `</div>`;
    if (!buy.length) h += `<div class="empty">Всё нужное уже есть дома 🎉</div>`;
  }
  h += `<div class="card list" style="margin-top:10px"><div class="list-h">Своё</div>${S.shop.extra.map(x => `<div class="shop-row ${x.done ? 'done' : ''}" data-a="extra-check" data-id="${x.id}" role="checkbox" aria-checked="${!!x.done}" tabindex="0"><span class="ck"></span><div class="sr-name"><span>${esc(x.n)}</span></div><button class="x" data-a="extra-del" data-id="${x.id}" aria-label="Удалить">×</button></div>`).join('')}<div class="add-row"><input class="inp" id="extra-inp" placeholder="Например, бумажные полотенца" enterkeyhint="done"><button class="btn sm" data-a="extra-add">Добавить</button></div></div>`;
  if (home.length) h += `<details class="home-box card"><summary>Уже есть дома: ${home.length}</summary><div class="list">${home.map(it => shopRow(it, 'home')).join('')}</div></details>`;
  const nChecked = buy.filter(it => S.shop.checked[it.p]).length + S.shop.extra.filter(x => x.done).length;
  if (nChecked) h += `<button class="btn block" style="margin-top:14px" data-a="shop-to-pantry">Купленное убрать в холодильник (${nChecked})</button>`;
  return h;
}

/* ---------- Экраны поверх ---------- */
function viewHead(title) {
  return `<div class="vhead">${inTG ? '' : `<button class="icon-btn" data-a="back" aria-label="Назад">${ICON.back}</button>`}<h2>${esc(title)}</h2></div>`;
}
function renderViews() {
  const layer = $('#view-layer');
  const v = topView();
  if (!v) { layer.classList.remove('open', 'push'); layer.innerHTML = ''; UI.lastVid = null; return; }
  if (!v.vid) v.vid = uid('v');
  const same = UI.lastVid === v.vid;
  const st = layer.scrollTop;
  let html = '';
  if (v.type === 'dish') { if (!S.dishes[v.id]) { UI.views.pop(); return renderViews(); } html = renderDishView(v); }
  else if (v.type === 'edit') html = renderEditor(v);
  else if (v.type === 'products') html = renderProductsView();
  layer.innerHTML = `<div class="view">${html}</div>`;
  layer.classList.add('open');
  if (same) layer.scrollTop = st;
  else { layer.scrollTop = v.scroll || 0; layer.classList.remove('push'); void layer.offsetWidth; layer.classList.add('push'); }
  UI.lastVid = v.vid;
}
function pushView(v) { const cur = topView(); if (cur) cur.scroll = $('#view-layer').scrollTop; UI.views.push(v); render(); }

function renderDishView(v) {
  const id = v.id, d = S.dishes[id], a = analyze(d);
  const u = photoURL[id];
  let h = `<div style="position:relative">${inTG ? '' : `<button class="icon-btn hero-back" data-a="back" aria-label="Назад">${ICON.back}</button>`}<button class="hero" style="background:${tint(id)}" data-a="photo-dish" data-id="${id}" aria-label="Изменить фото">${u ? `<img src="${u}" alt="${esc(d.n)}">` : `<span>${esc(d.e)}</span><span class="hero-hint">Нажмите, чтобы добавить фото</span>`}</button></div>`;
  h += `<div class="pad"><h1 class="d-title">${esc(d.n)}</h1><div class="tags">${MEAL_KEYS.filter(m => d.m.includes(m)).map(m => `<span class="tag">${MEALS[m]}</span>`).join('')}</div>`;
  if (d.cnt) h += `<p class="hint small">Готовили ${d.cnt} ${plural(d.cnt, ['раз', 'раза', 'раз'])}${d.last ? `, последний раз ${dayShort(d.last).toLowerCase()}` : ''}</p>`;
  h += `<div class="actions"><button class="btn" data-a="dish-to-menu" data-id="${id}">В меню</button><button class="btn soft" data-a="dish-cooked" data-id="${id}">Приготовили</button><button class="btn soft" data-a="dish-edit" data-id="${id}">Изменить</button></div>`;
  const f = 1;
  h += `<h2 class="sec">Обязательно, на ${d.s} ${plural(d.s, ['порцию', 'порции', 'порций'])}</h2><div class="card list">${d.r.map((g, gi) => {
    const ok = !a.missing.includes(gi);
    return `<div class="ing"><span class="st ${ok ? 'y' : 'n'}">${ok ? '✓' : ''}</span><div class="grow">${g.map(([p, q], oi) => `<div style="display:flex">${oi ? '<span class="alt">или&nbsp;</span>' : ''}<span class="grow">${esc(pname(p))}${atHome(p) && g.length > 1 ? ' <span class="alt">— дома</span>' : ''}</span><span class="q">${fmtQ(q * f, punit(p))}</span></div>`).join('')}</div></div>`;
  }).join('')}</div>`;
  if (d.o.length) h += `<h2 class="sec">По желанию</h2><div class="card list">${d.o.map(([p, q]) => `<div class="ing"><span class="st ${atHome(p) ? 'y' : 'n'}">${atHome(p) ? '✓' : ''}</span><span class="grow">${esc(pname(p))}</span><span class="q">${fmtQ(q, punit(p))}</span></div>`).join('')}</div>`;
  h += `<h2 class="sec">Как готовим</h2>${d.t ? `<div class="card notes">${esc(d.t)}</div>` : `<button class="link" data-a="dish-edit" data-id="${id}">+ Записать рецепт</button>`}`;
  h += `<p class="hint small" style="margin:18px 4px 0">Зелёная галочка — продукт есть дома.</p></div>`;
  return h;
}

function ingRow(k, g, o, [p, q]) {
  return `<div class="ing-row"><span class="dot" style="background:${catColor(p)}"></span><span class="grow">${esc(pname(p))}</span><input class="qty" type="text" inputmode="decimal" value="${String(q).replace('.', ',')}" data-i="ed-qty" data-k="${k}" data-g="${g}" data-o="${o}" aria-label="Количество"><span class="unit">${esc(punit(p))}</span><button class="x" data-a="ing-del" data-k="${k}" data-g="${g}" data-o="${o}" aria-label="Убрать">×</button></div>`;
}
function renderEditor(v) {
  const d = v.draft;
  const prev = v.photoURL || (v.id && photoURL[v.id]);
  let h = viewHead(v.id ? 'Изменить блюдо' : 'Новое блюдо') + `<div class="pad">`;
  h += `<button class="photo-pick" style="background:${tint(v.id || 'new')}" data-a="ed-photo">${prev ? `<img src="${prev}" alt="">` : `<span>${esc(d.e || '🍽️')}</span>`}<span class="hero-hint">${prev ? 'Заменить фото' : 'Добавить фото'}</span></button>`;
  h += `<div class="two"><label class="fld"><span>Название</span><input class="inp" data-i="ed-name" value="${esc(d.n)}" placeholder="Например, Плов"></label><label class="fld"><span>Значок</span><input class="inp" data-i="ed-emoji" value="${esc(d.e)}" maxlength="4" style="text-align:center"></label></div>`;
  h += `<div class="fld"><span>Подходит для</span><div class="chips">${MEAL_KEYS.map(m => `<button class="chip ${d.m.includes(m) ? 'on' : ''}" data-a="ed-meal" data-m="${m}">${MEALS[m]}</button>`).join('')}</div></div>`;
  h += `<div class="fld"><span>Обязательные продукты</span>${d.r.length ? `<div class="card list">${d.r.map((g, gi) => `<div class="ing-group">${g.map((o, oi) => (oi ? '<div class="or">или</div>' : '') + ingRow('r', gi, oi, o)).join('')}<button class="link small" data-a="ing-alt" data-g="${gi}">+ или другой продукт</button></div>`).join('')}</div>` : ''}<button class="link" data-a="ing-add" data-k="r">+ Добавить продукт</button></div>`;
  h += `<div class="fld"><span>По желанию</span>${d.o.length ? `<div class="card list">${d.o.map((o, oi) => ingRow('o', oi, 0, o)).join('')}</div>` : ''}<button class="link" data-a="ing-add" data-k="o">+ Добавить продукт</button></div>`;
  h += `<div class="row-between"><span>Количество указано на</span><div class="stepper"><button data-a="ed-serv" data-v="-1" aria-label="Меньше">−</button><b>${d.s}</b><button data-a="ed-serv" data-v="1" aria-label="Больше">+</button></div></div>`;
  h += `<label class="fld"><span>Как готовим</span><textarea class="inp" rows="5" data-i="ed-notes" placeholder="Шаги, время, хитрости">${esc(d.t)}</textarea></label>`;
  if (v.id) h += `<button class="btn danger block" data-a="ed-delete">Удалить блюдо</button>`;
  h += `<div style="height:${inTG ? 10 : 80}px"></div></div>`;
  return h;
}

function renderProductsView() {
  const ids = sortProducts(Object.keys(S.products));
  const usage = {};
  Object.values(S.dishes).forEach(d => new Set(allPids(d)).forEach(p => { usage[p] = (usage[p] || 0) + 1; }));
  let h = viewHead('Продукты') + `<div class="pad"><p class="hint small" style="margin:4px 4px 12px">Отдел определяет, в каком блоке продукт окажется в списке покупок.</p>`;
  let cur = null;
  ids.forEach(p => {
    const c = S.products[p].c;
    if (c !== cur) { if (cur) h += `</div>`; h += `<h2 class="sec">${CATS[c]?.n || 'Прочее'}</h2><div class="card list">`; cur = c; }
    h += `<div class="li tap" data-a="prod-edit" data-p="${p}" role="button" tabindex="0"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${catColor(p)}"></span><div class="grow">${esc(pname(p))}</div><span class="hint small">${punit(p)}${usage[p] ? `, в ${usage[p]} ${plural(usage[p], ['блюде', 'блюдах', 'блюдах'])}` : ''}</span></div>`;
  });
  if (cur) h += `</div>`;
  h += `<button class="btn soft block" style="margin-top:14px" data-a="prod-new">Новый продукт</button></div>`;
  return h;
}

/* ---------- формы шторок ---------- */
function productForm(f, saveAct, extra = '') {
  return `<label class="fld"><span>Название</span><input class="inp" data-i="form-name" value="${esc(f.n)}"></label>
  <div class="fld"><span>Отдел магазина</span><div class="chips">${CAT_KEYS.map(c => `<button class="chip ${f.c === c ? 'on' : ''}" data-a="form-cat" data-c="${c}"><span class="dot" style="background:${CATS[c].c}"></span>${CATS[c].n}</button>`).join('')}</div></div>
  <div class="fld"><span>Единица</span><div class="chips">${UNITS.map(u => `<button class="chip ${f.u === u ? 'on' : ''}" data-a="form-unit" data-u="${u}">${u}</button>`).join('')}</div></div>
  <button class="btn block" data-a="${saveAct}">Сохранить</button>${extra}`;
}
function productListBody(c, mode) {
  if (c.form) return productForm(c.form, 'pc-save', `<button class="btn ghost block" data-a="pc-cancel">Назад к списку</button>`);
  const q = (c.q || '').trim().toLowerCase();
  const ids = sortProducts(Object.keys(S.products).filter(p => !q || pname(p).toLowerCase().includes(q)));
  let h = '';
  let cur = null;
  ids.forEach(p => {
    const cat = S.products[p].c;
    if (cat !== cur) { if (cur) h += `</div>`; h += `<h2 class="sec" style="margin-top:14px">${CATS[cat]?.n || 'Прочее'}</h2><div class="chips">`; cur = cat; }
    const on = mode === 'pantry' ? atHome(p) : false;
    h += `<button class="chip ${on ? 'on' : ''}" data-a="${mode === 'pantry' ? 'pantry-toggle' : 'pick-product'}" data-p="${p}"><span class="dot" style="background:${catColor(p)}"></span>${esc(pname(p))}</button>`;
  });
  if (cur) h += `</div>`;
  const exact = Object.keys(S.products).some(p => pname(p).toLowerCase() === q);
  if (q && !exact) h += `<button class="btn soft block" style="margin-top:16px" data-a="pc-new">Создать продукт «${esc(c.q.trim())}»</button>`;
  else if (!q) h += `<button class="btn ghost block" style="margin-top:16px" data-a="pc-new">Нет нужного? Создать продукт</button>`;
  return h;
}
function openPantryAdd() {

    head: () => `<div class="sheet-head"><h3>Что есть дома</h3><input class="inp" type="search" data-i="sheet-q" placeholder="Найти продукт"></div>`,

    onCreated: pid => { S.pantry[pid] = { t: Date.now(), hot: false }; save(); },

}
function openProductPicker(onPick, title = 'Выберите продукт') {

}

function dishPickBody(c) {
  const q = (c.q || '').trim().toLowerCase();
  const list = Object.entries(S.dishes).filter(([, d]) => (c.all || d.m.includes(c.m)) && (!q || d.n.toLowerCase().includes(q)))
    .map(([id, d]) => ({ id, d, a: analyze(d) }))
    .sort((x, y) => (homeScore(y.a) - homeScore(x.a)) || x.d.n.localeCompare(y.d.n, 'ru'));
  return `<div class="chips" style="margin-bottom:10px"><button class="chip ${!c.all ? 'on' : ''}" data-a="dp-all" data-v="0">Для: ${MEALS[c.m].toLowerCase()}</button><button class="chip ${c.all ? 'on' : ''}" data-a="dp-all" data-v="1">Все блюда</button></div>
  ${list.length ? `<div class="card list">${list.map(x => sugCard(x, 'pick-dish')).join('')}</div>` : '<div class="empty">Нет подходящих блюд</div>'}
  <p class="hint small" style="margin:10px 4px 0">Сверху блюда, для которых больше всего продуктов уже есть дома.</p>`;
}

function entryBody(c) {
  const e = findEntry(c.k, c.m, c.eid);
  if (!e || !S.dishes[e.d]) return '<div class="empty">Блюдо убрано из меню</div>';
  const d = S.dishes[e.d];
  let h = `<div class="ent-head">${thumb(e.d)}<div><h3>${esc(d.n)}</h3><div class="hint small">${MEALS[c.m]}, ${dayShort(c.k).toLowerCase()}</div></div></div>`;
  h += `<div class="row-between"><span>Порций</span><div class="stepper"><button data-a="ent-p" data-v="-1" aria-label="Меньше">−</button><b>${e.p}</b><button data-a="ent-p" data-v="1" aria-label="Больше">+</button></div></div>`;
  d.r.forEach((g, gi) => {
    if (g.length < 2) return;
    const sel = Math.min(e.ch?.[gi] ?? 0, g.length - 1);
    h += `<div class="fld"><span>Что берём</span><div class="chips">${g.map(([p], oi) => `<button class="chip ${oi === sel ? 'on' : ''}" data-a="ent-ch" data-g="${gi}" data-o="${oi}">${esc(pname(p))}${atHome(p) ? ' ✓' : ''}</button>`).join('')}</div></div>`;
  });
  if (d.o.length) {
    h += `<div class="fld"><span>По желанию</span><div class="chips">${d.o.map(([p]) => atHome(p) ? `<span class="chip home">✓ ${esc(pname(p))}, дома</span>` : `<button class="chip ${e.opt?.includes(p) ? 'on' : ''}" data-a="ent-opt" data-p="${p}">${esc(pname(p))}</button>`).join('')}</div><p class="hint small" style="margin:8px 4px 0">Отмеченное попадёт в список покупок.</p></div>`;
  }
  h += `<div class="btn-row" style="margin-top:16px"><button class="btn" data-a="ent-cooked">${e.done ? 'Не готовили' : 'Приготовили'}</button><button class="btn soft" data-a="open-dish" data-id="${e.d}">Открыть блюдо</button></div><button class="btn danger block" style="margin-top:8px" data-a="ent-del">Убрать из меню</button>`;
  return h;
}

function openCooked(dishId, entry) {
  const d = S.dishes[dishId];
  let used;
  if (entry) used = [...entryNeeds(entry).map(([p]) => p), ...d.o.map(([p]) => p)].filter(atHome);
  else used = analyze(d).used;
  used = [...new Set(used)];
  const finish = () => { d.cnt = (d.cnt || 0) + 1; d.last = todayKey(); if (entry) entry.done = true; save(); };
  if (!used.length) { finish(); haptic('ok'); toast('Отмечено: приготовили'); render(); return; }
  openSheetCtl({
    kind: 'cooked', dishId, used, sel: new Set(), finish,
    head: () => `<h3>Что закончилось?</h3><p class="hint small" style="margin:-6px 2px 12px">Отмеченное уберём из холодильника.</p>`,
    body: c => `<div class="chips">${c.used.map(p => `<button class="chip ${c.sel.has(p) ? 'on' : ''}" data-a="ck-toggle" data-p="${p}">${esc(pname(p))}</button>`).join('')}</div><button class="btn block" style="margin-top:18px" data-a="ck-done">Готово</button>`,
    onClose: () => render()
  });
}

function pickRandom() {
  const { ready, almost } = suggestions(UI.homeMeal);
  let pool = ready.length ? ready : almost;
  if (!pool.length) pool = Object.entries(S.dishes).filter(([, d]) => !UI.homeMeal || d.m.includes(UI.homeMeal)).map(([id, d]) => ({ id, d, a: analyze(d) }));
  if (!pool.length) return null;
  pool = pool.slice(0, 8);
  const cur = sctx()?.id;
  const opts = pool.length > 1 ? pool.filter(x => x.id !== cur) : pool;
  return opts[Math.floor(Math.random() * opts.length)].id;
}
function openRandom() {
  const id = pickRandom();
  if (!id) return toast('Сначала добавьте блюда');
  openSheetCtl({
    kind: 'rand', id,
    body: c => {
      const d = S.dishes[c.id], a = analyze(d);
      const miss = a.missing.map(gi => groupLabel(d.r[gi]));
      return `${thumb(c.id, 'lg')}<h3 style="margin:14px 2px 4px">${esc(d.n)}</h3>${a.used.length ? `<p class="sub ok hint small" style="margin:0 2px 4px">Есть: ${esc(a.used.map(pname).join(', '))}</p>` : ''}${miss.length ? `<p class="sub miss hint small" style="margin:0 2px 4px">Докупить: ${esc(miss.join(', '))}</p>` : ''}
      <div class="btn-row" style="margin-top:16px"><button class="btn soft" data-a="rand-next">Другое</button><button class="btn" data-a="rand-today">В меню на сегодня</button></div><button class="btn ghost block" data-a="open-dish" data-id="${c.id}">Открыть блюдо</button>`;
    },
    onClose: () => render()
  });
}

function openToMenu(id) {
  const d = S.dishes[id];
  const days = [...Array(7)].map((_, i) => { const x = new Date(); x.setDate(x.getDate() + i); return dkey(x); });
  const m0 = d.m.includes(mealByTime()) ? mealByTime() : d.m[0] || 'l';

/* ---------- экспорт / импорт ---------- */
function blobToDataURL(b) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
function dataURLToBlob(u) { const [h, d] = u.split(','); const mime = (h.match(/:(.*?);/) || [])[1] || 'image/jpeg'; const bin = atob(d); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
async function exportData() {
  const photos = {};
  for (const [k, b] of await DB.entries('photos')) if (b) photos[k] = await blobToDataURL(b);
  const blob = new Blob([JSON.stringify({ app: 'chto-gotovim', v: 1, state: S, photos })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `chto-gotovim-${todayKey()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Файл сохранён');
}
async function importData(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return alertMsg('Не удалось прочитать файл. Нужен файл, сохранённый из этого приложения.'); }
  const st = data.state || data;
  if (!st || !st.products || !st.dishes) return alertMsg('В файле нет базы блюд. Нужен файл, сохранённый из этого приложения.');
  if (!(await confirmAsk(SERVER ? 'Заменить общую базу данными из файла? Изменится у вас обоих.' : 'Заменить текущую базу данными из файла?'))) return;
  SYNC.hold = true;
  toast('Загружаем…');
  S = migrate(st); S.photos = {};
  await DB.clear('photos'); SYNC.photoVers = {};
  for (const [k, u] of Object.entries(data.photos || {})) {
    if (!S.dishes[k]) continue;
    try { if (SERVER) await savePhoto(k, dataURLToBlob(u)); else await DB.set('photos', k, dataURLToBlob(u)); } catch (e) {}
  }
  SYNC.hold = false;
  await loadPhotos();
  UI.views = []; closeSheet(true); save(); render(); toast('База загружена');
}
async function mergeImport(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return alertMsg('Не удалось прочитать файл. Нужен файл с базой блюд в формате JSON.'); }
  const st = data.state || data;
  if (!st || !st.dishes) return alertMsg('В файле нет блюд.');
  toast('Добавляем блюда…');
  const byName = {};
  Object.keys(S.products).forEach(p => { byName[pname(p).toLowerCase()] = p; });
  const pidMap = {};
  for (const [pid, pr] of Object.entries(st.products || {})) {
    if (!pr || !pr.n) continue;
    const key = String(pr.n).trim().toLowerCase();
    if (byName[key]) { pidMap[pid] = byName[key]; continue; }
    const nid = S.products[pid] ? uid('p') : pid;
    S.products[nid] = { n: key, c: CATS[pr.c] ? pr.c : 'other', u: UNITS.includes(pr.u) ? pr.u : 'г' };
    pidMap[pid] = nid; byName[key] = nid;
  }
  const names = new Set(Object.values(S.dishes).map(d => d.n.trim().toLowerCase()));
  const mapOpt = o => (pidMap[o[0]] ? [pidMap[o[0]], Number(o[1]) || 0] : null);
  let added = 0, skipped = 0;
  for (const [did, d] of Object.entries(st.dishes)) {
    if (!d || !d.n) continue;
    if (names.has(d.n.trim().toLowerCase())) { skipped++; continue; }
    const r = (d.r || []).map(g => g.map(mapOpt).filter(Boolean)).filter(g => g.length);
    const o = (d.o || []).map(mapOpt).filter(Boolean);
    const m = (d.m || []).filter(x => MEAL_KEYS.includes(x));
    const nid = uid('d');
    S.dishes[nid] = { n: d.n.trim(), e: d.e || '🍽️', m: m.length ? m : ['l', 'd'], r, o, t: d.t || '', s: d.s || 2, cnt: 0, last: null };
    names.add(d.n.trim().toLowerCase());
    const ph = data.photos && data.photos[did];
    if (ph) { try { await savePhoto(nid, dataURLToBlob(ph)); } catch (e) {} }
    added++;
  }
  closeSheet(true); save(); render();
  alertMsg(`Добавлено блюд: ${added}.` + (skipped ? ` Пропущено, потому что уже есть: ${skipped}.` : ''));
}

  },
  async reset() {
    if (!(await confirmAsk(SERVER ? 'Вернуть исходную базу? Правки, меню, холодильник и фото удалятся у вас обоих.' : 'Вернуть исходную базу? Ваши правки, меню, холодильник и фото будут удалены.'))) return;
    S = buildSeed(); SYNC.photoVers = {}; await DB.clear('photos'); await loadPhotos(); UI.views = []; closeSheet(true); save(); render(); toast('Исходная база восстановлена');
  }
};

const INP = {
  'dish-q'(el) { UI.dishQ = el.value; $('#dish-grid').innerHTML = dishGrid(); },
  'sheet-q'(el) { const c = sctx(); if (!c) return; c.q = el.value; c.form = null; refreshSheet(); },
  'ed-name'(el) { topView().draft.n = el.value; },
  'ed-emoji'(el) { topView().draft.e = el.value.trim() || '🍽️'; },
  'ed-notes'(el) { topView().draft.t = el.value; },
  'ed-qty'(el) {
    const d = topView().draft, g = Number(el.dataset.g), o = Number(el.dataset.o);
    const v = parseFloat(el.value.replace(',', '.')) || 0;
    if (el.dataset.k === 'r') d.r[g][o][1] = v; else d.o[g][1] = v;
  },
  'form-name'(el) { sctx().form.n = el.value; }
};

function openEditor(id) {
  const src = id ? S.dishes[id] : { n: '', e: '🍽️', m: [], r: [], o: [], t: '', s: 2 };
  pushView({ type: 'edit', id, draft: clone({ n: src.n, e: src.e, m: src.m, r: src.r, o: src.o, t: src.t, s: src.s }), photo: null, photoURL: null });
}
async function saveDraft() {
  const v = topView(); if (!v || v.type !== 'edit') return;
  const d = v.draft; d.n = d.n.trim();
  if (!d.n) return alertMsg('Введите название блюда');
  if (!d.m.length) return alertMsg('Выберите хотя бы один приём пищи');
  if (!d.r.length) return alertMsg('Добавьте хотя бы один обязательный продукт');
  const id = v.id || uid('d');
  S.dishes[id] = Object.assign({ cnt: 0, last: null }, S.dishes[id] || {}, d);
  if (v.photo) await trySavePhoto(id, v.photo);
  if (v.photoURL) URL.revokeObjectURL(v.photoURL);
  save();
  UI.views.pop();
  if (!v.id) UI.views.push({ type: 'dish', id });
  haptic('ok'); toast('Блюдо сохранено'); render();
}

/* ================= События ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = ACT[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'extra-inp') { e.preventDefault(); ACT['extra-add'](); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"],[role="checkbox"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') goBack();
});
document.addEventListener('input', e => { const el = e.target.closest('[data-i]'); if (el && INP[el.dataset.i]) INP[el.dataset.i](el, e); });
document.addEventListener('change', async e => {
  if (e.target.id === 'file-photo') {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    let blob;
    try { blob = await compress(f); } catch (err) { return alertMsg('Не получилось открыть фото. Попробуйте другое изображение.'); }
    const t = UI.photoTarget; UI.photoTarget = null;
    if (t && t.editor) { const v = topView(); if (v.photoURL) URL.revokeObjectURL(v.photoURL); v.photo = blob; v.photoURL = URL.createObjectURL(blob); renderViews(); }
    else if (t && t.dish) { if (await trySavePhoto(t.dish, blob)) { render(); toast('Фото сохранено'); } }
  }
  if (e.target.id === 'file-import') { const f = e.target.files[0]; e.target.value = ''; if (f) { closeSheet(true); if (UI.importMode === 'merge') mergeImport(f); else importData(f); } }
});
$('#fallback-main').addEventListener('click', () => mainHandler && mainHandler());

/* ================= Запуск ================= */
async function init() {
  if (inTG) {
    tg.ready(); tg.expand();
    try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    try { if (ver('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } } catch (e) {}
    if (ver('6.1')) tg.BackButton.onClick(goBack);
    tg.MainButton.onClick(() => mainHandler && mainHandler());
  }
  renderTabs();
  await DB.open();
  let st = await DB.get('kv', 'state');
  if (!st) { try { st = JSON.parse(localStorage.getItem('chto-gotovim') || 'null'); } catch (e) {} }
  UI.homeMeal = mealByTime();
  if (SERVER) {
    await initServer(st);
    setInterval(() => { if (document.visibilityState === 'visible') { push(); pull(); } }, CFG.POLL_MS || 8000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
    return;
  }
  S = st && st.dishes ? migrate(st) : buildSeed();
  await loadPhotos();
  render();
  save();
}
init();
</script>
</body></html>
